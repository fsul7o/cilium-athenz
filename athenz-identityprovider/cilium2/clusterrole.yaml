apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identityprovider-remote-reader
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - cilium.io
    resources:
      - ciliumidentities
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - cilium.io
    resources:
      - ciliumendpoints
    verbs:
      - get
      - list
      - watch
