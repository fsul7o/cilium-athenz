---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identityprovider-cilium2

resources:
  - ../../kustomize

patches:
  - target:
      kind: ClusterRole
      name: identityprovider-list-nodes
    patch: |
      - op: replace
        path: /metadata/name
        value: identityprovider-list-nodes-cilium2
    options:
      allowNameChange: true
  - target:
      kind: ClusterRole
      name: identityprovider-list-pods
    patch: |
      - op: replace
        path: /metadata/name
        value: identityprovider-list-pods-cilium2
    options:
      allowNameChange: true
  - target:
      kind: ClusterRoleBinding
      name: identityprovider-list-nodes
    patch: |
      - op: replace
        path: /metadata/name
        value: identityprovider-list-nodes-cilium2
      - op: replace
        path: /roleRef/name
        value: identityprovider-list-nodes-cilium2
      - op: replace
        path: /subjects/0/namespace
        value: identityprovider-cilium2
    options:
      allowNameChange: true
  - target:
      kind: ClusterRoleBinding
      name: identityprovider-list-pods
    patch: |
      - op: replace
        path: /metadata/name
        value: identityprovider-list-pods-cilium2
      - op: replace
        path: /roleRef/name
        value: identityprovider-list-pods-cilium2
      - op: replace
        path: /subjects/0/namespace
        value: identityprovider-cilium2
    options:
      allowNameChange: true
  - target:
      kind: RoleBinding
    patch: |
      - op: replace
        path: /subjects/0/namespace
        value: identityprovider-cilium2
  - target:
      kind: ConfigMap
      name: identityprovider-policy
    patch: |
      - op: replace
        path: /data/config.yaml
        value: |
          config:
            debug: true
            constraints:
              athenz:
                domain:
                  name: "cilium"
                  prefix: ""
                  suffix: ""
                namespace:
                  trimprefix: ""
                  trimsuffix: ""
                identityprovider:
                  service: cilium.identityprovider2
              cert:
                expiry:
                  defaultminutes: 43200
                  maxminutes: 43200
                refresh: true
                sandns:
                  - glob: "*.*.svc.cluster.local"
                  - glob: "*.instanceid.*.svc.cluster.local"
                  - glob: "*.instanceid.zts.athenz.cloud"
              keys:
                jwks:
                  url: http://127.0.0.1:8001/openid/v1/jwks
                  cacert: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  force_cache_duration_seconds: 3600
                apinodes:
                  url: http://127.0.0.1:8001/api/v1/nodes
                static: ""
              system:
                authz:
                  keys:
                    jwks:
                      url: http://127.0.0.1:8002/openid/v1/jwks
                    apinodes:
                      url: http://127.0.0.1:8002/api/v1/nodes
              kubernetes:
                namespaces:
                  - kube-system
                serviceaccount:
                  names:
                    - cilium-agent
                    - cilium-operator
                  token:
                    issuers:
                      - https://kubernetes.default.svc
                      - https://kubernetes.default.svc.cluster.local
                    audiences:
                      - https://kubernetes.default.svc
                      - https://kubernetes.default.svc.cluster.local
                    issuer: https://kubernetes.default.svc.cluster.local
                    audience: https://kubernetes.default.svc
