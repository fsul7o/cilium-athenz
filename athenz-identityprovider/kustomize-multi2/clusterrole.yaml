---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identityprovider2-list-nodes
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identityprovider2-list-pods
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - watch
