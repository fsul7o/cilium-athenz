---
# SDS Configuration to watch X.509 certificate changes from the filesystem.
# The kind node inotify limits are tuned during kind setup so Envoy can keep using
# filesystem-backed SDS without crashing on startup.
resources:
  - "@type": "type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret"
    name: identity_sds
    tls_certificate:
      certificate_chain:
        filename: /var/run/athenz/tls.crt
      private_key:
        filename: /var/run/athenz/tls.key
      watched_directory:
        path: /var/run/athenz
