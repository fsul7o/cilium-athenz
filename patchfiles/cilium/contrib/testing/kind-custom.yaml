image:
  pullPolicy: Never
  useDigest: false

serviceAccounts:
  cilium:
    name: cilium-agent

hostAliases:
  - ip: "__ATHENZ_HOST_IP__"
    hostnames:
      - athenz-zts-server.athenz
      - athenz-zms-server.athenz

operator:
  identityGCInterval: 30s
  identityHeartbeatTimeout: 1m
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/hostname: cilium-worker
  image:
    pullPolicy: Never
    useDigest: false
  hostAliases:
    - ip: "__ATHENZ_HOST_IP__"
      hostnames:
        - athenz-zts-server.athenz
        - athenz-zms-server.athenz

envoy:
  image:
    pullPolicy: Never
    useDigest: false

authentication:
  enabled: true
  mutual:
    port: 4250
    connectTimeout: 5s
    athenz:
      enabled: true
      domain: cilium
      providerService: cilium.identityprovider
      spiffeTrustDomain: athenz.io
      spiffeNamespace: default
      zts:
        endpoint: https://athenz-zts-server.athenz:32443/zts/v1
        caSecretName: athenz-cacert
      zms:
        endpoint: https://athenz-zms-server.athenz:32444/zms/v1
        timeout: 10s
      policySync:
        enabled: true
    # spire:
    #   enabled: true
    #   install:
    #     enabled: true
