image:
  pullPolicy: Never
  useDigest: false

serviceAccounts:
  cilium:
    name: cilium-agent

hostAliases:
  - ip: "__ATHENZ_ZTS_HOST_IP__"
    hostnames:
      - athenz-zts-server.athenz

operator:
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/hostname: cilium-worker
  image:
    pullPolicy: Never
    useDigest: false
  hostAliases:
    - ip: "__ATHENZ_ZTS_HOST_IP__"
      hostnames:
        - athenz-zts-server.athenz

envoy:
  image:
    pullPolicy: Never
    useDigest: false

authentication:
  enabled: true
  mutual:
    athenz:
      enabled: true
      domain: cilium
      providerService: cilium.identityprovider
      zts:
        endpoint: https://athenz-zts-server.athenz:32443/zts/v1
        caSecretName: athenz-cacert
    spire:
      enabled: true
      install:
        enabled: true
