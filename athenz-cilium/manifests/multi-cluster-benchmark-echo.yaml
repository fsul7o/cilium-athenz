apiVersion: v1
kind: ServiceAccount
metadata:
  name: echo-auth
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: echo-plain
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: echo-auth
  name: echo-auth
  namespace: default
  annotations:
    service.cilium.io/global: "true"
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: echo-auth
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: echo-plain
  name: echo-plain
  namespace: default
  annotations:
    service.cilium.io/global: "true"
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: echo-plain
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: echo-auth
  name: echo-auth
  namespace: default
spec:
  serviceAccountName: echo-auth
  containers:
  - image: gcr.io/k8s-staging-ingressconformance/echoserver:v20221109-7ee2f3e
    name: echo
    ports:
    - containerPort: 3000
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: echo-plain
  name: echo-plain
  namespace: default
spec:
  serviceAccountName: echo-plain
  containers:
  - image: gcr.io/k8s-staging-ingressconformance/echoserver:v20221109-7ee2f3e
    name: echo
    ports:
    - containerPort: 3000
