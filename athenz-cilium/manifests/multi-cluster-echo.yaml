apiVersion: v1
kind: ServiceAccount
metadata:
  name: echo
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: echo
  name: echo
  namespace: default
  annotations:
    service.cilium.io/global: "true"
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: echo
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: echo
  name: echo
  namespace: default
spec:
  serviceAccountName: echo
  containers:
  - image: gcr.io/k8s-staging-ingressconformance/echoserver:v20221109-7ee2f3e
    name: echo
    ports:
    - containerPort: 3000
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
